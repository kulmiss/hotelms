<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Inter, Arial, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#0f172a">VPS: the two install options</text>
  <rect x="30" y="70" width="400" height="320" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="230" y="98" font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a">A) Docker</text>
  <rect x="50" y="115" width="360" height="50" rx="8" fill="#ecfdf5" stroke="#16a34a"/>
  <text x="230" y="137" font-size="12" text-anchor="middle" fill="#0f172a">Nginx + Certbot on the server (HTTPS, app files)</text>
  <text x="230" y="154" font-size="11" text-anchor="middle" fill="#475569">PHP requests → 127.0.0.1:9000</text>
  <rect x="50" y="180" width="360" height="190" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-dasharray="6 4"/>
  <text x="230" y="200" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a">docker compose (files in deploy-guide/files/docker)</text>
  <rect x="65" y="215" width="160" height="60" rx="8" fill="#fff7ed" stroke="#d97706"/>
  <text x="145" y="240" font-size="12" text-anchor="middle" fill="#0f172a">app</text>
  <text x="145" y="258" font-size="11" text-anchor="middle" fill="#475569">PHP 8.3-FPM</text>
  <rect x="235" y="215" width="160" height="60" rx="8" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="315" y="240" font-size="12" text-anchor="middle" fill="#0f172a">scheduler</text>
  <text x="315" y="258" font-size="11" text-anchor="middle" fill="#475569">schedule:work</text>
  <rect x="65" y="290" width="160" height="60" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="145" y="315" font-size="12" text-anchor="middle" fill="#0f172a">mysql 8.4</text>
  <text x="145" y="333" font-size="11" text-anchor="middle" fill="#475569">data in a volume</text>
  <rect x="235" y="290" width="160" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="315" y="315" font-size="12" text-anchor="middle" fill="#0f172a">redis 7</text>
  <text x="315" y="333" font-size="11" text-anchor="middle" fill="#475569">cache, sessions</text>
  <rect x="470" y="70" width="400" height="320" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="670" y="98" font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a">B) Manual (no Docker)</text>
  <rect x="490" y="115" width="360" height="50" rx="8" fill="#ecfdf5" stroke="#16a34a"/>
  <text x="670" y="137" font-size="12" text-anchor="middle" fill="#0f172a">Nginx + Certbot (HTTPS, app files)</text>
  <text x="670" y="154" font-size="11" text-anchor="middle" fill="#475569">PHP requests → /run/php/php8.3-fpm.sock</text>
  <rect x="490" y="180" width="170" height="60" rx="8" fill="#fff7ed" stroke="#d97706"/>
  <text x="575" y="205" font-size="12" text-anchor="middle" fill="#0f172a">PHP 8.3-FPM</text>
  <text x="575" y="223" font-size="11" text-anchor="middle" fill="#475569">apt packages</text>
  <rect x="680" y="180" width="170" height="60" rx="8" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="765" y="205" font-size="12" text-anchor="middle" fill="#0f172a">cron (www-data)</text>
  <text x="765" y="223" font-size="11" text-anchor="middle" fill="#475569">schedule:run</text>
  <rect x="490" y="255" width="170" height="60" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="575" y="280" font-size="12" text-anchor="middle" fill="#0f172a">MySQL 8.0</text>
  <text x="575" y="298" font-size="11" text-anchor="middle" fill="#475569">Ubuntu package</text>
  <rect x="680" y="255" width="170" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="765" y="280" font-size="12" text-anchor="middle" fill="#0f172a">Redis 7</text>
  <text x="765" y="298" font-size="11" text-anchor="middle" fill="#475569">optional</text>
  <rect x="490" y="330" width="360" height="45" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="670" y="357" font-size="11" text-anchor="middle" fill="#475569">Supervisor queue worker: optional (nothing is queued today)</text>
</svg>
