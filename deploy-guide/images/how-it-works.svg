<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Inter, Arial, sans-serif">
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#0f172a">How HotelMS runs on a server</text>
  <text x="30" y="62" font-size="13" fill="#475569">The same package works on shared hosting (cPanel) and on a VPS.</text>
  <!-- browser -->
  <rect x="30" y="110" width="170" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="145" font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a">Staff browser</text>
  <text x="115" y="166" font-size="12" text-anchor="middle" fill="#475569">phone, tablet, computer</text>
  <text x="115" y="184" font-size="12" text-anchor="middle" fill="#475569">https://&lt;YOUR_DOMAIN&gt;</text>
  <line x1="200" y1="155" x2="290" y2="155" stroke="#0f172a" stroke-width="2" marker-end="url(#a)"/>
  <text x="245" y="145" font-size="11" text-anchor="middle" fill="#475569">HTTPS</text>
  <!-- web server -->
  <rect x="290" y="90" width="330" height="250" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="455" y="118" font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a">Web server (Apache / Nginx)</text>
  <text x="455" y="138" font-size="12" text-anchor="middle" fill="#475569">document root = hotelms/public</text>
  <rect x="310" y="155" width="140" height="80" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="185" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">The app</text>
  <text x="380" y="204" font-size="11" text-anchor="middle" fill="#475569">app.html, assets/,</text>
  <text x="380" y="220" font-size="11" text-anchor="middle" fill="#475569">sw.js (offline copy)</text>
  <rect x="460" y="155" width="140" height="80" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="530" y="185" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">Laravel API</text>
  <text x="530" y="204" font-size="11" text-anchor="middle" fill="#475569">/api, /sanctum, /up</text>
  <text x="530" y="220" font-size="11" text-anchor="middle" fill="#475569">index.php · PHP 8.3</text>
  <rect x="310" y="250" width="290" height="70" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="455" y="278" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">Cron, every minute</text>
  <text x="455" y="298" font-size="11" text-anchor="middle" fill="#475569">php artisan schedule:run → bookings, reports,</text>
  <text x="455" y="312" font-size="11" text-anchor="middle" fill="#475569">backups, alerts, clean-ups, queue</text>
  <!-- db -->
  <line x1="620" y1="195" x2="700" y2="195" stroke="#0f172a" stroke-width="2" marker-end="url(#a)"/>
  <rect x="700" y="110" width="170" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="785" y="143" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">MySQL 8</text>
  <text x="785" y="163" font-size="11" text-anchor="middle" fill="#475569">all hotel data,</text>
  <text x="785" y="178" font-size="11" text-anchor="middle" fill="#475569">sessions, cache, queue</text>
  <rect x="700" y="210" width="170" height="70" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="785" y="240" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">Redis (optional)</text>
  <text x="785" y="260" font-size="11" text-anchor="middle" fill="#475569">VPS only, faster cache</text>
  <rect x="700" y="295" width="170" height="70" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="785" y="325" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">Disk</text>
  <text x="785" y="345" font-size="11" text-anchor="middle" fill="#475569">uploads + backups</text>
  <text x="30" y="395" font-size="12" fill="#475569">Not needed: an always-on worker, WebSockets, Node on the server. Node is only used on your laptop to build the package.</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker></defs>
</svg>
