; HotelMS production PHP settings (VPS: /etc/php/8.3/fpm/conf.d/99-hotelms.ini and /etc/php/8.3/cli/conf.d/99-hotelms.ini;
; Docker: copied into the image). Payment proofs and guest ID photos may be up to 8 MB (8192 KB in the app).
upload_max_filesize = 9M
post_max_size = 10M
memory_limit = 256M
max_execution_time = 60
expose_php = Off

; Speed: OPcache on. Files are re-checked every 2 seconds, so an update shows without a restart.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
realpath_cache_size = 4096K
realpath_cache_ttl = 600
