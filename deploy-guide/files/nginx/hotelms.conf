# HotelMS – Nginx site for a VPS (deploy-guide/vps.md). Copy to /etc/nginx/sites-available/hotelms
# Based on docs/hosting.md (2b) plus: no-cache for app.html and sw.js (as public/.htaccess does on Apache),
# security headers repeated in every block that sets its own headers (Nginx drops the outer ones there).
# Run "sudo certbot --nginx -d <YOUR_DOMAIN>" afterwards: Certbot adds the HTTPS (443) part and the redirect itself.

server {
    listen 80;
    listen [::]:80;
    server_name <YOUR_DOMAIN>;

    root /var/www/hotelms/public;
    index app.html index.php;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Uploads: payment proofs and guest ID photos are up to 8 MB.
    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # API, sign-in cookie and health check: Laravel.
    location ~ ^/(api|sanctum|up)(/|$) {
        try_files $uri /index.php?$query_string;
    }

    # Built files have a hash in their name: cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # The app page and the offline copy (service worker) must never be cached, or staff keep an old version.
    location = /app.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Uploaded logos: pictures only, never run as a page.
    location /storage/ {
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Every other address of the app (e.g. /reservations/12): the app page.
    location / {
        try_files $uri $uri/ /app.html;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        # Option B (manual install):
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        # Option A (Docker): comment the line above and use this one instead:
        # fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 120s;
    }

    # Hidden files (.env, .git …) are never served. Let's Encrypt's /.well-known stays reachable.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
