; OPTIONAL queue worker (deploy-guide/vps.md, option B). HotelMS does not need it: the scheduler already runs
; "queue:work --stop-when-empty" every minute, and today nothing is put on the queue. Use it only if a future
; version tells you to. Copy to /etc/supervisor/conf.d/hotelms-worker.conf, then:
;   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl status
[program:hotelms-worker]
command=php /var/www/hotelms/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/hotelms
user=www-data
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/var/www/shared/storage/logs/worker.log
