<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1a1aa"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs><rect width="900" height="340" rx="12" fill="#fff"/><text x="24" y="34" font-size="16" font-weight="700" fill="#18181b">Hotel isolation: three layers (a leak between hotels is the worst bug)</text><rect x="24" y="64" width="268" height="96" rx="10" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/><text x="158.0" y="98.5" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">1. Database</text><text x="158.0" y="116.5" text-anchor="middle" font-size="12" font-weight="400" fill="#71717a">every hotel table has hotel_id</text><text x="158.0" y="134.5" text-anchor="middle" font-size="12" font-weight="400" fill="#71717a">(and branch_id where it matters)</text><rect x="316" y="64" width="268" height="96" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="450.0" y="98.5" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">2. Model</text><text x="450.0" y="116.5" text-anchor="middle" font-size="12" font-weight="400" fill="#71717a">BelongsToHotel trait: where hotel_id = current</text><text x="450.0" y="134.5" text-anchor="middle" font-size="12" font-weight="400" fill="#71717a">fills hotel_id; no hotel → no rows</text><rect x="608" y="64" width="268" height="96" rx="10" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/><text x="742.0" y="98.5" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">3. Request</text><text x="742.0" y="116.5" text-anchor="middle" font-size="12" font-weight="400" fill="#71717a">hotel comes from the signed-in user</text><text x="742.0" y="134.5" text-anchor="middle" font-size="12" font-weight="400" fill="#71717a">never from the URL, body or a header</text><text x="24" y="196" text-anchor="start" font-size="13" font-weight="700" fill="#18181b">Not scoped — add the filter yourself:</text><text x="24" y="222" text-anchor="start" font-size="12" font-weight="400" fill="#71717a">• User (sign-in is platform-wide) → where hotel_id = …</text><text x="24" y="244" text-anchor="start" font-size="12" font-weight="400" fill="#71717a">• DB::table(...) raw queries → where hotel_id = …</text><text x="460" y="222" text-anchor="start" font-size="12" font-weight="400" fill="#71717a">• Jobs / seeders → TenantContext::runAs($hotel, fn () =&gt; …)</text><text x="460" y="244" text-anchor="start" font-size="12" font-weight="400" fill="#71717a">• Super Admin views → acrossAllHotels(fn () =&gt; …)</text><text x="24" y="300" text-anchor="start" font-size="11.5" font-weight="400" fill="#71717a">Tested by tests/Feature/Tenancy/IsolationSweepTest.php: every API route, called as another hotel and as a one-branch user.</text></svg>
