<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1a1aa"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs><rect width="900" height="330" rx="12" fill="#fff"/><text x="24" y="34" font-size="16" font-weight="700" fill="#18181b">How one request travels</text><rect x="24" y="90" width="150" height="70" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/><text x="99.0" y="120.5" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Browser</text><text x="99.0" y="138.5" text-anchor="middle" font-size="12" font-weight="400" fill="#71717a">React app</text><rect x="214" y="90" width="150" height="70" rx="10" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/><text x="289.0" y="120.5" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">auth:sanctum</text><text x="289.0" y="138.5" text-anchor="middle" font-size="12" font-weight="400" fill="#71717a">who are you?</text><rect x="404" y="90" width="150" height="70" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="479.0" y="120.5" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">tenant</text><text x="479.0" y="138.5" text-anchor="middle" font-size="12" font-weight="400" fill="#71717a">hotel = user.hotel_id</text><rect x="594" y="90" width="130" height="70" rx="10" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/><text x="659.0" y="120.5" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">can:… / module</text><text x="659.0" y="138.5" text-anchor="middle" font-size="12" font-weight="400" fill="#71717a">allowed?</text><rect x="764" y="90" width="112" height="70" rx="10" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/><text x="820.0" y="120.5" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Controller</text><text x="820.0" y="138.5" text-anchor="middle" font-size="12" font-weight="400" fill="#71717a">→ Service</text><path d="M174,125 L214,125" fill="none" stroke="#a1a1aa" stroke-width="1.8"  marker-end="url(#a)"/><path d="M364,125 L404,125" fill="none" stroke="#a1a1aa" stroke-width="1.8"  marker-end="url(#a)"/><path d="M554,125 L594,125" fill="none" stroke="#a1a1aa" stroke-width="1.8"  marker-end="url(#a)"/><path d="M724,125 L764,125" fill="none" stroke="#a1a1aa" stroke-width="1.8"  marker-end="url(#a)"/><text x="24" y="76" text-anchor="start" font-size="12" font-weight="400" fill="#71717a">GET /api/v1/reservations/42 (cookie session)</text><rect x="764" y="220" width="112" height="60" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/><text x="820.0" y="245.5" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">MySQL</text><text x="820.0" y="263.5" text-anchor="middle" font-size="12" font-weight="400" fill="#71717a">scoped query</text><path d="M820,160 L820,220" fill="none" stroke="#a1a1aa" stroke-width="1.8"  marker-end="url(#a)"/><path d="M764,250 L99,250 L99,160" fill="none" stroke="#0d9488" stroke-width="1.8"  marker-end="url(#t)"/><text x="430" y="243" text-anchor="middle" font-size="12" fill="#71717a" paint-order="stroke" stroke="#fff" stroke-width="4">JSON  { &quot;data&quot;: … }  money as strings &quot;4662.50&quot;</text><text x="404" y="190" text-anchor="start" font-size="11" font-weight="400" fill="#71717a">Sets TenantContext before route binding,</text><text x="404" y="205" text-anchor="start" font-size="11" font-weight="400" fill="#71717a">so {reservation} is already this hotel only.</text><text x="24" y="312" text-anchor="start" font-size="11.5" font-weight="400" fill="#71717a">401 = not signed in · 403 = no permission / module off · 404 = not found or another hotel&#x27;s record · 422 = check the form</text></svg>
