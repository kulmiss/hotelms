# Secret scan (SECURITY_REPORT L11): gitleaks on the commits of a pull request only – a few seconds,
# so it runs on every PR (any path). A leaked key, token or password fails the check.
name: Secrets

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    # Draft PRs (the lower ones in a stack) are not tested; the top PR is (owner, 14 Nov 2026).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 (Oct 2026); move on purpose, after a test run
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get gitleaks 8.21.2
        run: curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
      - name: Scan the commits of this pull request
        run: |
          RANGE="origin/${{ github.base_ref || 'main' }}..HEAD"
          ./gitleaks git --redact --no-banner --log-opts="$RANGE" --exit-code 1
