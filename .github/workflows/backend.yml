# Laravel: security audit, code style (fixed on PRs), migrations back and forward, tests, big-hotel speed test.
# Runs only when these files change in a pull request (saves GitHub Actions minutes), or by hand:
# GitHub → Actions → "Backend" → Run workflow.
name: Backend

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # Draft PRs (the lower ones in a stack) are not tested; the top PR is (owner, 14 Nov 2026).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Backend (Laravel)
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 (Oct 2026); move on purpose, after a test run
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: hotelms_test
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: hotelms_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, redis, intl, bcmath, zip, gd
          coverage: none
      - name: Install packages
        run: |
          if [ -f composer.lock ]; then composer install --no-interaction --prefer-dist; else composer update --no-interaction --prefer-dist; fi
      - name: Prepare app
        run: cp .env.example .env && php artisan key:generate
      - name: Security audit
        run: composer audit
      - name: Code style (fixed automatically on pull requests)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            vendor/bin/pint
            if [ -n "$(git status --porcelain -- . ':!composer.lock')" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -am "Code style (fixed by CI)" && git push
            fi
          fi
          vendor/bin/pint --test
      - name: Migrations go back and forward (rollback plan)
        run: |
          php artisan migrate --force
          php artisan migrate:rollback --step=1 --force
          php artisan migrate --force
          php artisan migrate:status | tail -3
      - name: Tests
        run: php artisan test
      - name: Speed test (big hotel, 160 rooms, a year of bookings)
        run: php artisan test tests/Performance
      - name: Save composer.lock if it was missing
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain composer.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add composer.lock && git commit -m "Add backend/composer.lock (generated by CI)" && git push
          fi
