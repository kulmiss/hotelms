# React: security audit, lint, type check, tests, build, first-download size.
# Runs only when these files change in a pull request (saves GitHub Actions minutes), or by hand:
# GitHub → Actions → "Frontend" → Run workflow.
name: Frontend

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 (Oct 2026); move on purpose, after a test run
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install packages
        run: |
          git pull --ff-only || true
          if [ -f package-lock.json ]; then npm ci || npm install; else npm install; fi
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: First download size (gzip, shown in the run summary)
        run: node scripts/first-download.mjs
      - name: Save package-lock.json if it was missing
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json && git commit -m "Add frontend/package-lock.json (generated by CI)" && git push
          fi
