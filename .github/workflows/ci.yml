name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: hotelms_test
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: hotelms_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, redis, intl, bcmath, zip, gd
          coverage: none
      - name: Install packages
        run: |
          if [ -f composer.lock ]; then composer install --no-interaction --prefer-dist; else composer update --no-interaction --prefer-dist; fi
      - name: Prepare app
        run: cp .env.example .env && php artisan key:generate
      - name: Security audit
        run: composer audit
      - name: Code style (fixed automatically on pull requests)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            vendor/bin/pint
            if [ -n "$(git status --porcelain -- . ':!composer.lock')" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -am "Code style (fixed by CI)" && git push
            fi
          fi
          vendor/bin/pint --test
      - name: Migrations go back and forward (rollback plan)
        run: |
          php artisan migrate --force
          php artisan migrate:rollback --step=1 --force
          php artisan migrate --force
          php artisan migrate:status | tail -3
      - name: Tests
        run: php artisan test
      - name: Speed test (big hotel, 160 rooms, a year of bookings)
        run: php artisan test tests/Performance
      - name: Save composer.lock if it was missing
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain composer.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add composer.lock && git commit -m "Add backend/composer.lock (generated by CI)" && git push
          fi

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    needs: backend # avoids two jobs pushing lock files at the same time
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install packages
        run: |
          git pull --ff-only || true
          if [ -f package-lock.json ]; then npm ci || npm install; else npm install; fi
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: First download size (gzip, shown in the run summary)
        run: node scripts/first-download.mjs
      - name: Save package-lock.json if it was missing
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json && git commit -m "Add frontend/package-lock.json (generated by CI)" && git push
          fi

  package:
    name: Package (deploy/package.sh)
    runs-on: ubuntu-latest
    needs: frontend # runs after the lock files are settled
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, intl, bcmath, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Plant files from a developer's work folder (must NOT end up in the package)
        run: |
          echo "DB_PASSWORD=dev-secret" > backend/.env
          touch backend/.phpunit.result.cache
          echo "dev log" > backend/storage/logs/laravel.log
          mkdir -p backend/storage/app/private/payment-proofs backend/storage/app/backups
          echo "test upload" > backend/storage/app/private/payment-proofs/test-upload.jpg
          echo "backup" > backend/storage/app/backups/old.sql.gz
          echo "<?php" > backend/storage/framework/views/compiled-view.php
          echo "session" > backend/storage/framework/sessions/dev-session
          echo "<?php return [];" > backend/bootstrap/cache/config.php
          ln -s ../storage/app/public backend/public/storage
      - name: Build the package
        run: ./deploy/package.sh
      - name: Check the package
        run: |
          unzip -Z1 build/hotelms.zip > list.txt
          fail() { echo "::error::$1"; exit 1; }
          pictures=$(ls frontend/public/guide | wc -l)
          packed=$(grep -c '^hotelms/public/guide/.*\.webp$' list.txt || true)
          [ "$packed" -eq "$pictures" ] || fail "Staff-guide pictures: $packed of $pictures in the package"
          for f in hotelms/public/app.html hotelms/public/sw.js hotelms/public/.htaccess hotelms/public/index.php \
                   hotelms/artisan hotelms/.env.production.example hotelms/vendor/autoload.php hotelms/docs/README.md; do
            grep -qx "$f" list.txt || fail "Missing: $f"
          done
          for d in app/public app/private framework/cache/data framework/sessions framework/views logs; do
            grep -qx "hotelms/storage/$d/" list.txt || fail "Missing empty folder: storage/$d"
          done
          bad=$(grep -E '^hotelms/(\.env$|\.phpunit|tests/|public/storage|bootstrap/cache/config\.php)|^hotelms/storage/.*[^/]$' list.txt | grep -v '/\.gitignore$' || true)
          [ -z "$bad" ] || fail "Files from the work folder are in the package: $bad"
          grep -q '^hotelms/vendor/phpunit/' list.txt && fail "Developer packages (phpunit) are in the package"
          {
            echo "### Package: build/hotelms.zip ($(du -h build/hotelms.zip | cut -f1), $(wc -l < list.txt) entries)"
            echo "- Staff-guide pictures: **$packed of $pictures** in \`public/guide/\`"
            echo "- Planted work-folder files (.env, upload, log, session, cached view, backup, cached config, public/storage link): **none in the package**"
            echo ""
            echo '```'
            echo "Top level:"; grep -E '^hotelms/[^/]+/?$' list.txt | sort
            echo ""; echo "public/ (without assets/):"; grep -E '^hotelms/public/' list.txt | grep -v '/assets/.' | sort
            echo ""; echo "storage/ (empty folders only):"; grep -E '^hotelms/storage/' list.txt | sort
            echo ""; echo "bootstrap/cache/:"; grep -E '^hotelms/bootstrap/cache/' list.txt | sort
            echo '```'
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          cat summary.md   # also in the job log
          echo "Everything outside vendor/ and public/assets/:"
          grep -v -E '^hotelms/(vendor/.|public/assets/.)' list.txt | sort
          cp list.txt build/hotelms-contents.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hotelms-package
          path: |
            build/hotelms.zip
            build/hotelms-contents.txt
          retention-days: 7
