name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: hotelms_test
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: hotelms_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, redis, intl, bcmath, zip, gd
          coverage: none
      - name: Install packages
        run: |
          if [ -f composer.lock ]; then composer install --no-interaction --prefer-dist; else composer update --no-interaction --prefer-dist; fi
      - name: Prepare app
        run: cp .env.example .env && php artisan key:generate
      - name: Security audit
        run: composer audit
      - name: Code style (fixed automatically on pull requests)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            vendor/bin/pint
            if [ -n "$(git status --porcelain -- . ':!composer.lock')" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -am "Code style (fixed by CI)" && git push
            fi
          fi
          vendor/bin/pint --test
      - name: Tests
        run: php artisan test
      - name: Save composer.lock if it was missing
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain composer.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add composer.lock && git commit -m "Add backend/composer.lock (generated by CI)" && git push
          fi

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    needs: backend # avoids two jobs pushing lock files at the same time
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install packages
        run: |
          git pull --ff-only || true
          if [ -f package-lock.json ]; then npm ci || npm install; else npm install; fi
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Save package-lock.json if it was missing
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json && git commit -m "Add frontend/package-lock.json (generated by CI)" && git push
          fi
