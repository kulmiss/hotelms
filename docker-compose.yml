# Local development: `docker compose up` then open http://localhost:5173
name: hotelms

services:
  mysql:
    image: mysql:8.4
    # Development only: no binary log (faster writes, e.g. the demo reset), more memory for data.
    command: ['--skip-log-bin', '--innodb-buffer-pool-size=512M', '--innodb-flush-log-at-trx-commit=2']
    environment:
      MYSQL_DATABASE: hotelms
      MYSQL_USER: hotelms
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports: ['3306:3306']
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uhotelms', '-psecret']
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']

  mailpit:
    # Catches every email the app sends: http://localhost:8025
    image: axllent/mailpit
    ports: ['8025:8025']

  backend:
    build: ./backend
    volumes: ['./backend:/var/www/backend']
    ports: ['8000:8000']
    environment:
      # Answer several requests at the same time (a page asks for 5–10 things at once).
      PHP_CLI_SERVER_WORKERS: 8
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }

  # Background work (expiring bookings, reports, alerts, Telegram, backups, demo reset),
  # like the every-minute cron line on a real server.
  scheduler:
    build: ./backend
    volumes: ['./backend:/var/www/backend']
    # The backend container installs packages and runs migrations; this one waits for that, then runs the schedule.
    entrypoint: ['sh', '-c', 'until php artisan migrate:status --no-interaction >/dev/null 2>&1; do sleep 5; done; exec php artisan schedule:work']
    depends_on: [backend]

  frontend:
    build: ./frontend
    volumes: ['./frontend:/app']
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports: ['5173:5173']
    depends_on: [backend]

volumes:
  mysql-data:
