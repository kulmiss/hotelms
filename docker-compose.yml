# Local development: `docker compose up` then open http://localhost:5173
name: hotelms

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: hotelms
      MYSQL_USER: hotelms
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports: ['3306:3306']
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uhotelms', '-psecret']
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']

  mailpit:
    # Catches every email the app sends: http://localhost:8025
    image: axllent/mailpit
    ports: ['8025:8025']

  backend:
    build: ./backend
    volumes: ['./backend:/var/www/backend']
    ports: ['8000:8000']
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }

  frontend:
    build: ./frontend
    volumes: ['./frontend:/app']
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports: ['5173:5173']
    depends_on: [backend]

volumes:
  mysql-data:
